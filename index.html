<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Свічки — демо-магазин ароматизованих свічок</title>
  <meta name="description" content="Демо-магазин ароматизованих свічок">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a href="index.html">Свічки</a>
    <nav>
      <a href="index.html">Каталог</a>
      <a href="cart.html">Кошик</a>
      <a href="checkout.html">Оформлення</a>
    </nav>
  </header>

  <main>
    <h1>Ароматизовані свічки</h1>
      <section id="catalog">
  <div class="product-grid">

    <article class="product-card" data-id="1" data-name="Ванільний вечір" data-price="349">
      <img src="img/vanilla.png" alt="Ароматична свічка «Ванільний вечір»" width="400" height="400" loading="lazy">
      <h2>Ванільний вечір</h2>
      <p class="product-description">Соєвий віск, аромат ванілі та карамелі. Горить до 40 годин.</p>
      <p class="product-price">349 грн</p>
      <button type="button">Додати в кошик</button>
    </article>
    <article class="product-card" data-id="2" data-name="Лавандовий спокій" data-price="379">
      <img src="img/lavender.png" alt="Ароматична свічка «Лавандовий спокій»" width="400" height="400" loading="lazy">
      <h2>Лавандовий спокій</h2>
      <p class="product-description">Соєвий віск, натуральна лаванда та нотки ромашки. Горить до 45 годин.</p>
      <p class="product-price">379 грн</p>
      <button type="button">Додати в кошик</button>
    </article>

  </div>
</section>
  </main>

  <footer>
    <p>© 2026 Свічки</p>
  </footer>

</body>
</html>
